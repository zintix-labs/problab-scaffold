# [Document URL] None
# [Gameplay] 3 or more Scatters in BG stop at a choice point where the player picks
# FG-A (more spins) or FG-B (fewer spins, multiplied wins). 3 or more Scatters in
# FG-A lead to FG-B, and in FG-B to FG-A. Continuation segments read no checkpoint,
# so each entry can be configured with its own optimal library.

# GID: unique within the catalog
game_id: 3

# GameName: demo_entry | a segmented game whose entries trigger each other
game_name: demo_entry

# LogicKey: selects the internal logic implementation (can be shared by multiple games)
logic_key: demo_entry

# Bet units for each bet_mode (index-aligned).
bet_units : [40]

# Max win limit (relative to bet_units[0])
max_win_limit : 400000

# optimal config: off by default; no pre-generated library is shipped
optimal_setting:
  use_optimal: false

# Game mode settings. Each entry represents a state; the game transitions between states (e.g., BaseGame -> FreeGame).
game_mode_settings:
